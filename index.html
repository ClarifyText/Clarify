<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarify</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Clarify</h1>

        <form action="/summarize" method="POST">

            <textarea
                name="text"
                placeholder="Paste your text here..."
                required
            ></textarea>

            <button type="submit">Summarize</button>

        </form>

        {% if summary %}

        <div class="result">
            <h2>Summary</h2>
            <p>{{ summary }}</p>
        </div>

        <div class="speech">
            <h2>Listen</h2>

            <audio controls>
                <source src="/output.mp3" type="audio/mpeg">
            </audio>
        </div>

        {% endif %}

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clarify - Understand Faster</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Clarify</div>
        <a href="#" class="nav-link">About</a>
    </header>


    <main class="main">

        <!-- Main explanation box -->
        <section class="hero-box">

            <h1>Understand more.<br>Read less.</h1>

            <p>
                Paste a long article, lesson, or document and Clarify
                turns it into a clear summary with the most important ideas.
            </p>

        </section>


        <!-- Text input area -->
        <section class="input-section">

            <form action="/summarize" method="POST">

                <textarea
                    name="text"
                    placeholder="Paste your text here..."
                    required
                ></textarea>

                <div class="input-bottom">

                    <span class="hint">
                        Paste your text to get started
                    </span>

                    <button type="submit">
                        Summarize
                    </button>

                </div>

            </form>

        </section>


        <!-- Summary result -->
        <section class="result-box">

            <h2>Your Summary</h2>

            <p class="result-text">
                Your summary will appear here.
            </p>

        </section>


        <!-- Speech -->
        <section class="audio-box">

            <h2>Listen to your summary</h2>

            <audio controls>
                <source src="output.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </section>

    </main>

</body>
</html>
